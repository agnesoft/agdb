[package]
name = "agdb_benchmark"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agdb_api.workspace = true
agdb.workspace = true
num-format = { workspace = true, features = ["with-serde"] }
reqwest = { workspace = true, default-features = false, features = ["http2", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
tokio = { workspace = true, features = ["full"] }

[package.metadata.agci]
checks = ["format", "lint"]
depends = ["agdb_server"]
run = ["./agdb_server_benchmark.sh"]
