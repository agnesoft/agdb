[package]
name = "agdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Agnesoft Graph Database"
keywords = ["graph", "database"]
categories = ["database", "database-implementations"]

[lib]

[[bench]]
name = "collections"
harness = false

[[bench]]
name = "db"
harness = false

[[bench]]
name = "storage"
harness = false

[features]
default = ["derive"]
api = ["derive", "dep:tokio"]
derive = ["dep:agdb_derive"]
openapi = ["dep:utoipa"]
regex = ["dep:regex"]
serde = ["dep:serde"]

[dependencies]
agdb_derive = { workspace = true, optional = true }
agplatform = { workspace = true, features = ["fs"] }
regex = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "sync",
], optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
agbench.workspace = true
agplatform = { workspace = true, features = ["fs", "testing"] }
serde_json.workspace = true
