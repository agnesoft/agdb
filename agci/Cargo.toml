[package]
name = "agci"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agdb.workspace = true
agplatform = { workspace = true, features = ["fs", "process", "request", "tls"] }
agsource = { workspace = true, features = ["codegen"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
agplatform = { workspace = true, features = ["fs", "process", "request", "tls", "testing"] }
