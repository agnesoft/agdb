name: agci

on:
  pull_request:
    branches: ["main"]
    paths:
      - agci/**
      - Version
      - agdb_server/openapi.json
      - agdb_server/test_queries.json
      - .github/workflows/agci.yaml

jobs:
  agci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt,clippy
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: cargo fmt -p agci --check
      - run: cargo clippy -p agci --all-targets --all-features -- -D warnings
      - run: cargo run -p agci -r
      - run: |
          if [[ "$(git diff --name-only)" != "" ]]; then
            git diff
            git diff --name-only
            echo "ERROR: Some packages have not been updated. Please run 'cargo run -p agci -r' and commit the result."
            exit 1
          fi
