[package]
name = "agdb_api"
version = "0.16.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "Agnesoft Graph Database API (Client)"
keywords = ["graph", "database", "api"]
categories = ["database", "api-bindings"]

[lib]
bench = false

[features]
default = []
tls = ["reqwest/default-tls"]
api = ["agdb/api", "dep:tokio"]
test_server = ["dep:tokio"]

[dependencies]
agdb = { workspace = true, features = ["serde", "openapi"] }
reqwest = { workspace = true, default-features = false, features = ["charset", "http2", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"], optional = true }
utoipa.workspace = true
