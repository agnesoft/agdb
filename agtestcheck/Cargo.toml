[package]
name = "agtestcheck"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Cargo subcommand checking the structure of Rust tests"
keywords = ["parser", "cli", "test"]
categories.workspace = true

[[bin]]
name = "cargo-test-check"

[dependencies]
agplatform = { workspace = true, features = ["fs"] }
proc-macro2 = { workspace = true, default-features = false, features = [
    "span-locations",
] }
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
agplatform = { workspace = true, features = ["testing"] }
