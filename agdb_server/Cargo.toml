[package]
name = "agdb_server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Agnesoft Graph Database Server"
keywords = ["graph", "database", "api"]
categories = ["database", "database-implementations"]

[features]
default = []
tls = ["dep:axum-server", "dep:rustls", "reqwest/rustls", "agdb_api/tls"]
studio = ["dep:include_dir"]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dependencies]
agdb = { workspace = true, features = ["serde", "openapi", "regex"] }
agdb_api = { workspace = true, features = ["api"] }
async-stream.workspace = true
axum = { workspace = true, features = ["http2"] }
axum-extra = { workspace = true, features = ["typed-header", "routing"] }
axum-server = { workspace = true, features = ["tls-rustls"], optional = true }
bytes.workspace = true
crc.workspace = true
futures = { workspace = true, default-features = false, features = ["std"] }
http-body-util.workspace = true
include_dir = { workspace = true, optional = true }
reqwest = { workspace = true, default-features = false, features = [ "charset", "http2", "system-proxy", "json", "stream"] }
ring.workspace = true
rustls = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["cors", "fs"] }
tower.workspace = true
utoipa-rapidoc = { workspace = true, features = ["axum"] }
utoipa.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
agdb_api = { workspace = true, features = ["test_server"] }
anyhow.workspace = true
